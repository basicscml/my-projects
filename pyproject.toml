[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trades-collector"
version = "0.1.0"
description = "Collector for U.S. congressional (House & Senate) stock trade disclosures"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
trades-collect = "trades_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
